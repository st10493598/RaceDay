name: Part 2 - Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'Part 2/**'
      - '.github/workflows/part2-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Part 2/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "Part 2/RaceDay.API.Tests/RaceDay.API.Tests.csproj"

      - name: Build
        run: dotnet build "Part 2/RaceDay.API.Tests/RaceDay.API.Tests.csproj" --no-restore --configuration Release

      - name: Run tests
        run: dotnet test "Part 2/RaceDay.API.Tests/RaceDay.API.Tests.csproj" --no-build --configuration Release --verbosity normal
